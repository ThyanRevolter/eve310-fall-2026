name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the environment
        run: uv sync

      - name: Verify the environment students get is usable
        run: uv run python -c "import eve310, pandas, sklearn, pulp; print(eve310.__all__)"
