# EVE 310 Fall 2026 course website
# Built from Just the Class (https://github.com/kevinlin1/just-the-class)

title: EVE 310
tagline: Sustainable Systems Engineering · Fall 2026
description: >-
  Lab schedule, notebooks, and course information for EVE 310 at
  The University of Texas at Austin.
author: Dr. Greg Hendrickson
baseurl: '/eve310-fall-2026'
url: 'https://thyanrevolter.github.io'
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle

github_repo: ThyanRevolter/eve310-fall-2026
github_branch: main
canvas_url: https://utexas.instructure.com/courses/1450736

# Theme settings
remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: ut
search_enabled: true
heading_anchors: true
permalink: pretty
aux_links:
  GitHub:
    - 'https://github.com/ThyanRevolter/eve310-fall-2026'
  Canvas:
    - 'https://utexas.instructure.com/courses/1450736'
aux_links_new_tab: true
footer_content: >-
  EVE 310 · Fall 2026 · The University of Texas at Austin.
  Built with <a href="https://github.com/kevinlin1/just-the-class">Just the Class</a>.

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ThyanRevolter/eve310-fall-2026
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

callouts:
  note:
    color: blue
  warning:
    color: yellow
  important:
    color: purple

# Collections for website data
collections:
  staffers:
  schedules:
  announcements:
# Default layouts for each collection type
defaults:
  - scope:
      path: ''
      type: staffers
    values:
      layout: staffer
      height: 300
      subpath: '/assets/images/'
      width: 300
  - scope:
      path: ''
      type: schedules
    values:
      layout: schedule
  - scope:
      path: ''
      type: announcements
    values:
      layout: announcement

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

liquid:
  error_mode: strict
  strict_filters: true
